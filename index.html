        <section id="addBook" class="container-md my-4">
            <h3 class="text-primary fw-bold"><i class="fa-solid fa-square-plus"></i>Add a Book</h3>
            <p>List your book for exchange or donation.</p>
            <form class="mb-4 p-4 bg-light rounded">
                <div class="row g-3">
                    <div class="col-md-6">
                         <label for="book-title" class="form-label">Book Title </label>
                        <input type="text" class="form-control" id="book-title" placeholder="Enter book title">
                    </div>
                    <div class="col-md-6">
                         <label for="author" class="form-label">Author </label>
                        <input type="text" class="form-control" id="author"  placeholder="Enter author name">
                    </div>
                     <div class="col-md-6">
                        <label for="category" class="form-label">Category</label>
                        <select id="category" class="form-select">
                            <option value="">Select Category</option>
                            <option value="science">Science</option>
                            <option value="fiction">Fiction</option>
                            <option value="entrance">Entrance</option>
                            <option value="others">Others</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="contact" class="form-label">Contact Number</label>
                        <input type="text" maxlength="10"  class="form-control" id="contact" placeholder="Enter contact number.">
                    </div>
                    <div class="col-md-6">
                        <label for="image" class="form-label">Image Url</label>
                        <input type="text" class="form-control" id="image" placeholder="enter image url">
                    </div>
                    <div class="col-md-6">
                        <label for="donor" class="form-label">Donor Name</label>
                        <input type="text" class="form-control" id="donor" placeholder="Enter Donor name">
                    </div>
                    
                    <div col-md-2 >
                       <button id="submitBtn" type="submit" class="btn btn-primary   fw-bold commonGradient" >Submit Book</button>
                    </div>
                    
                </div>
            </form>
